name: Pinact

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinact:
    name: Verify pinned actions
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify GitHub Actions pins
        uses: suzuki-shunsuke/pinact-action@2a42f29b3397967439ed46e7650f3045f49699f9 # v3.0.1
        with:
          config: .pinact.yaml
          fix: "false"
          github_token: ${{ github.token }}
          verify: "true"
          verify_min_age: "true"
