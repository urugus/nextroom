name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Release workflow must run from a Git tag."
            exit 1
          fi

          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag mismatch: expected ${expected_tag}, got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Build and publish macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run release:mac

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: urugus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="dist/NextRoom-${version}-mac-arm64.zip"

          if [ ! -f "$artifact" ]; then
            echo "Release artifact not found: $artifact"
            exit 1
          fi

          sha256="$(shasum -a 256 "$artifact" | awk '{print $1}')"
          cask_path="homebrew-tap/Casks/nextroom.rb"

          ruby -0pi -e "gsub(/version \".*\"/, \"version \\\"${version}\\\"\"); gsub(/sha256 \".*\"/, \"sha256 \\\"${sha256}\\\"\")" "$cask_path"

          cd homebrew-tap
          if git diff --quiet -- Casks/nextroom.rb; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nextroom.rb
          git commit -m "Update NextRoom to ${version}"
          git push
