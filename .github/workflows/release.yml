name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release workflow must run from a release tag."
              exit 1
              ;;
          esac

          if ! git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            echo "Release tag does not exist: ${RELEASE_TAG}."
            exit 1
          fi

          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag mismatch: expected ${expected_tag}, got ${RELEASE_TAG}."
            exit 1
          fi

      - name: Verify Homebrew tap app credentials
        env:
          NEXTROOM_RELEASE_APP_CLIENT_ID: ${{ vars.NEXTROOM_RELEASE_APP_CLIENT_ID }}
          NEXTROOM_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NEXTROOM_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$NEXTROOM_RELEASE_APP_CLIENT_ID" ]; then
            echo "::error title=Missing NEXTROOM_RELEASE_APP_CLIENT_ID::Set the NEXTROOM_RELEASE_APP_CLIENT_ID repository variable before creating a release tag."
            exit 1
          fi

          if [ -z "$NEXTROOM_RELEASE_APP_PRIVATE_KEY" ]; then
            echo "::error title=Missing NEXTROOM_RELEASE_APP_PRIVATE_KEY::Set the NEXTROOM_RELEASE_APP_PRIVATE_KEY repository secret before creating a release tag."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Build macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run dist:mac

      - name: Verify local release artifacts
        run: |
          version="$(node -p "require('./package.json').version")"
          artifacts=(
            "dist/latest-mac.yml"
            "dist/NextRoom-${version}-mac-arm64.zip"
            "dist/NextRoom-${version}-mac-arm64.zip.blockmap"
            "dist/NextRoom-${version}-mac-arm64.dmg"
            "dist/NextRoom-${version}-mac-arm64.dmg.blockmap"
          )

          missing=0
          for artifact in "${artifacts[@]}"; do
            if [ ! -f "$artifact" ] || [ ! -s "$artifact" ]; then
              echo "::error title=Missing or empty release artifact::$artifact"
              missing=1
            fi
          done

          exit "$missing"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="$RELEASE_TAG"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --notes "NextRoom ${version}"
          else
            gh release edit "$tag" --draft
          fi

          gh release upload "$tag" --clobber \
            "dist/NextRoom-${version}-mac-arm64.zip" \
            "dist/NextRoom-${version}-mac-arm64.zip.blockmap" \
            "dist/NextRoom-${version}-mac-arm64.dmg" \
            "dist/NextRoom-${version}-mac-arm64.dmg.blockmap"
          gh release upload "$tag" --clobber "dist/latest-mac.yml"

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          required_assets=(
            "latest-mac.yml"
            "NextRoom-${version}-mac-arm64.zip"
            "NextRoom-${version}-mac-arm64.zip.blockmap"
            "NextRoom-${version}-mac-arm64.dmg"
            "NextRoom-${version}-mac-arm64.dmg.blockmap"
          )
          uploaded_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"

          missing=0
          for asset in "${required_assets[@]}"; do
            if ! printf '%s\n' "$uploaded_assets" | grep -Fxq "$asset"; then
              echo "::error title=Missing GitHub release asset::$asset"
              missing=1
            fi
          done

          exit "$missing"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Create Homebrew tap token
        id: homebrew-tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NEXTROOM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEXTROOM_RELEASE_APP_PRIVATE_KEY }}
          owner: urugus
          repositories: homebrew-tap

      - name: Checkout Homebrew tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: urugus/homebrew-tap
          token: ${{ steps.homebrew-tap-token.outputs.token }}
          path: homebrew-tap

      - name: Update Homebrew cask
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="dist/NextRoom-${version}-mac-arm64.zip"

          if [ ! -f "$artifact" ]; then
            echo "Release artifact not found: $artifact"
            exit 1
          fi

          sha256="$(shasum -a 256 "$artifact" | awk '{print $1}')"
          cask_path="homebrew-tap/Casks/nextroom.rb"

          VERSION="$version" SHA256="$sha256" ruby -0pi -e 'gsub(/version ".*"/, "version \"#{ENV.fetch("VERSION")}\""); gsub(/sha256 ".*"/, "sha256 \"#{ENV.fetch("SHA256")}\"")' "$cask_path"

          cd homebrew-tap
          if git diff --quiet -- Casks/nextroom.rb; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nextroom.rb
          git commit -m "Update NextRoom to ${version}"
          git push
